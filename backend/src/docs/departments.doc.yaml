paths:
  /api/v1/departments:
    get:
      summary: Get all departments
      description: >
        Retrieve all active departments. This endpoint requires authentication
        and is available to authenticated users.
      tags:
        - Departments
      security:
        - bearerAuth: []

      responses:
        "200":
          description: Departments retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

                  message:
                    type: string
                    example: Departments fetched successfully

                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Department"

        "401":
          description: Authentication required

    post:
      summary: Create a new department
      description: >
        Create a new department. Only ADMIN users are authorized to perform
        this operation. The department code must be unique.
      tags:
        - Departments
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDepartmentRequest"

      responses:
        "201":
          description: Department created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

                  message:
                    type: string
                    example: Department created successfully

                  data:
                    $ref: "#/components/schemas/Department"

        "400":
          description: Validation error

        "401":
          description: Authentication required

        "403":
          description: You do not have permission to perform this action

        "409":
          description: Department with this code already exists

  /api/v1/departments/{id}:
    get:
      summary: Get department by ID
      description: >
        Retrieve a single active department by its MongoDB ObjectId.
        Authentication is required.
      tags:
        - Departments
      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/DepartmentId"

      responses:
        "200":
          description: Department retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

                  message:
                    type: string
                    example: Department fetched successfully

                  data:
                    $ref: "#/components/schemas/Department"

        "400":
          description: Invalid department ID

        "401":
          description: Authentication required

        "404":
          description: Department not found

    patch:
      summary: Update department
      description: >
        Update an existing department. Only ADMIN users can update departments.
        At least one field must be provided. The department code must remain unique.
      tags:
        - Departments
      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/DepartmentId"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDepartmentRequest"

      responses:
        "200":
          description: Department updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

                  message:
                    type: string
                    example: Department updated successfully

                  data:
                    $ref: "#/components/schemas/Department"

        "400":
          description: Validation error or invalid department ID

        "401":
          description: Authentication required

        "403":
          description: You do not have permission to perform this action

        "404":
          description: Department not found

        "409":
          description: Department with this code already exists

    delete:
      summary: Delete department
      description: >
        Soft delete a department by setting isDeleted to true.
        The department is not permanently removed from the database.
        Only ADMIN users can perform this operation.
      tags:
        - Departments
      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/DepartmentId"

      responses:
        "200":
          description: Department deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

                  message:
                    type: string
                    example: Department deleted successfully

                  data:
                    nullable: true
                    example: null

        "400":
          description: Invalid department ID

        "401":
          description: Authentication required

        "403":
          description: You do not have permission to perform this action

        "404":
          description: Department not found

  /api/v1/departments/{id}/restore:
    patch:
      summary: Restore deleted department
      description: >
        Restore a previously soft-deleted department.
        Only ADMIN users can perform this operation.
      tags:
        - Departments
      security:
        - bearerAuth: []

      parameters:
        - $ref: "#/components/parameters/DepartmentId"

      responses:
        "200":
          description: Department restored successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

                  message:
                    type: string
                    example: Department restored successfully

                  data:
                    $ref: "#/components/schemas/Department"

        "400":
          description: Invalid department ID

        "401":
          description: Authentication required

        "403":
          description: You do not have permission to perform this action

        "404":
          description: Deleted department not found

        "409":
          description: Another active department already uses this code

components:
  schemas:
    Department:
      type: object
      properties:
        id:
          type: string
          description: MongoDB ObjectId of the department
          example: 507f1f77bcf86cd799439011

        name:
          type: string
          description: Department name
          example: Statistics

        code:
          type: string
          description: Unique department code
          example: STAT

        isDeleted:
          type: boolean
          description: Indicates whether the department has been soft deleted
          example: false

        createdAt:
          type: string
          format: date-time
          example: 2026-09-12T08:00:00.000Z

        updatedAt:
          type: string
          format: date-time
          example: 2026-09-12T08:00:00.000Z

    CreateDepartmentRequest:
      type: object
      required:
        - name
        - code
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Statistics

        code:
          type: string
          minLength: 2
          maxLength: 20
          description: >
            Unique department code. Letters, numbers, underscores and hyphens
            are allowed. The server converts the code to uppercase.
          example: STAT

    UpdateDepartmentRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Mathematics

        code:
          type: string
          minLength: 2
          maxLength: 20
          description: >
            Unique department code. The server converts the code to uppercase.
          example: MATH

  parameters:
    DepartmentId:
      name: id
      in: path
      required: true
      description: Valid MongoDB ObjectId of the department
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{24}$"
        example: 507f1f77bcf86cd799439011
