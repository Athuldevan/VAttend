paths:
  /health:
    get:
      summary: Health check endpoint
      description: Returns the health status of the API.
      tags:
        - Health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: Attendance Management System API is healthy
